<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muzyka tła – Pawilon C</title>
<style>
body{margin:0;background:#111;color:#e6e1d4;font-family:-apple-system,system-ui,"Segoe UI",sans-serif;font-size:17px}
.w{max-width:720px;margin:0 auto;padding:18px 16px 60px;display:grid;gap:14px}
h1{font-size:24px;margin:0}p{margin:0;color:#b8b2a4;line-height:1.5}
.card{display:grid;gap:8px;padding:14px;border:1px solid #333;border-radius:12px;background:#1a1a1a}
.card.on{border-color:#c9a45a;background:#221d12}
.card b{font-size:19px}
button{font-size:17px;padding:10px 16px;border-radius:8px;border:1px solid #8a2a2a;background:#5a1a1a;color:#fff;justify-self:start}
.st{color:#c9b98f;min-height:1.4em}
</style>
</head>
<body>
<div class="w">
<h1>Muzyka tła – próbki dla Pawilonu C</h1>
<p>Stuknij ▶ przy próbce. Muzyka gra w pętli, aż wybierzesz inną albo stukniesz ■. Najlepiej w słuchawkach, telefon nie może być wyciszony.</p>
<div id="list" style="display:grid;gap:10px"></div>
<div class="st" id="st"></div>
</div>
<script>
const OPTS=[
 ['0','Obecna (taka sama jak w Domu przy Wiśniowej)','Niski, buczący dron z szumem – dla porównania.'],
 ['1','Zepsuta pozytywka','Powolna, rozstrojona melodia pozytywki w molu, z echem pustej sali i cichym dronem pod spodem.'],
 ['2','Jarzeniówki i oddech szpitala','Bzyczenie starych lamp, powolny niski puls jak oddech budynku, dalekie metaliczne stuknięcia.'],
 ['3','Chór duchów','Miękkie, „ludzkie” akordy jak odległy chór w pustym korytarzu, powoli zmieniające się w molu.'],
 ['4','Smyczki grozy','Dysonansowe smyczki, które powoli narastają i opadają, z niskim basem – jak w horrorze.']
];
let ctx=null,master,rev,dry,noise,cur=null,curId=null;
function init(){if(ctx)return;const C=window.AudioContext||window.webkitAudioContext;ctx=new C();
 master=ctx.createGain();master.gain.value=1;master.connect(ctx.destination);
 const conv=ctx.createConvolver(),len=ctx.sampleRate*4,buf=ctx.createBuffer(2,len,ctx.sampleRate);for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2)}conv.buffer=buf;
 rev=ctx.createGain();rev.gain.value=.6;rev.connect(conv);conv.connect(master);dry=ctx.createGain();dry.connect(master);dry.connect(rev);
 const nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;noise=nb}
function stop(){if(!cur)return;const t=ctx.currentTime;cur.g.gain.cancelScheduledValues(t);cur.g.gain.setTargetAtTime(0,t,.6);const o=cur;o.tm.forEach(clearInterval);o.tm.forEach(clearTimeout);setTimeout(()=>o.nodes.forEach(n=>{try{n.stop()}catch(e){}}),3000);cur=null;curId=null}
function osc(type,f,gain,dest,nodes){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;g.gain.value=gain;o.connect(g);g.connect(dest);o.start();nodes.push(o);return {o,g}}
function noiseSrc(dest,nodes){const s=ctx.createBufferSource();s.buffer=noise;s.loop=true;s.connect(dest);s.start();nodes.push(s);return s}
const ENG={
 '0'(G,N,T){const root=55,lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=240;lp.Q.value=8;lp.connect(G);
  [[root,'sawtooth',1],[root*1.0071,'sawtooth',1],[root/2,'sine',1.2],[root*1.414,'triangle',.18]].forEach(p=>osc(p[1],p[0],p[2],lp,N));
  const l=osc('sine',.05,130,lp.frequency,N);const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=380;bp.Q.value=.5;const wg=ctx.createGain();wg.gain.value=.025;bp.connect(wg);wg.connect(G);noiseSrc(bp,N);return .07},
 '1'(G,N,T){const pad=ctx.createGain();pad.gain.value=.25;pad.connect(G);osc('sine',55,.6,pad,N);osc('sine',82.4,.25,pad,N);
  const mel=[[659,1],[622,1],[523,2],[494,1],[523,1],[440,2],[0,1],[392,1],[440,1],[494,1],[523,1],[494,2],[0,2],[659,1],[698,1],[659,1],[523,1],[494,3],[0,3]];let i=0;
  const box=(f)=>{const t=ctx.currentTime,det=1+(Math.random()-.5)*.012;[1,2.01,3.98].forEach((k,j)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f*k*det;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22/(j+1),t+.005);g.gain.exponentialRampToValueAtTime(.0004,t+2.2/(j+1));o.connect(g);g.connect(G);g.connect(rev);o.start(t);o.stop(t+2.5)})};
  const step=()=>{const [f,d]=mel[i%mel.length];i++;if(f)box(f*(Math.random()<.08?0.97:1));const slow=1+Math.sin(i/7)*.15;T.push(setTimeout(step,d*520*slow))};step();return .5},
 '2'(G,N,T){const hum=ctx.createGain();hum.gain.value=.05;hum.connect(G);osc('sawtooth',100,.4,hum,N);osc('square',120,.08,hum,N);
  const hp=ctx.createBiquadFilter();hp.type='bandpass';hp.frequency.value=3500;hp.Q.value=4;const hg=ctx.createGain();hg.gain.value=.03;hp.connect(hg);hg.connect(G);noiseSrc(hp,N);
  const fl=()=>{const t=ctx.currentTime;hum.gain.setValueAtTime(.05,t);if(Math.random()<.5){hum.gain.setValueAtTime(.005,t+.05);hum.gain.setValueAtTime(.05,t+.12);hum.gain.setValueAtTime(.01,t+.2);hum.gain.setValueAtTime(.05,t+.26)}T.push(setTimeout(fl,2000+Math.random()*6000))};fl();
  const br=ctx.createBiquadFilter();br.type='lowpass';br.frequency.value=160;const bg=ctx.createGain();bg.gain.value=0;br.connect(bg);bg.connect(G);noiseSrc(br,N);osc('sine',41,.0,bg,N);
  const breathe=()=>{const t=ctx.currentTime;bg.gain.cancelScheduledValues(t);bg.gain.setValueAtTime(bg.gain.value,t);bg.gain.linearRampToValueAtTime(.9,t+2.6);bg.gain.linearRampToValueAtTime(.05,t+6);T.push(setTimeout(breathe,7000))};breathe();
  const clank=()=>{const t=ctx.currentTime,f=180+Math.random()*400;[1,2.7,5.1].forEach((k,j)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f*k;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05/(j+1),t+.004);g.gain.exponentialRampToValueAtTime(.0003,t+1.6);o.connect(g);g.connect(rev);o.start(t);o.stop(t+1.8)});T.push(setTimeout(clank,5000+Math.random()*9000))};T.push(setTimeout(clank,3000));return .6},
 '3'(G,N,T){const chords=[[110,130.8,164.8],[103.8,130.8,155.6],[98,123.5,146.8],[87.3,110,130.8],[92.5,116.5,138.6]];const voices=[];
  const F=[[700,1220,2600],[400,800,2600],[300,870,2240]];
  for(let v=0;v<3;v++){const src=ctx.createOscillator(),src2=ctx.createOscillator();src.type='sawtooth';src2.type='sawtooth';src2.detune.value=9;const mix=ctx.createGain();mix.gain.value=.12;src.connect(mix);src2.connect(mix);
   const out=ctx.createGain();out.gain.value=1;F[0].forEach((f,k)=>{const b=ctx.createBiquadFilter();b.type='bandpass';b.frequency.value=f;b.Q.value=9;const bg=ctx.createGain();bg.gain.value=[1,.5,.25][k];mix.connect(b);b.connect(bg);bg.connect(out);voices.push({b,k})});
   out.connect(G);out.connect(rev);const vib=ctx.createOscillator(),vg=ctx.createGain();vib.frequency.value=4.5+v*.4;vg.gain.value=3;vib.connect(vg);vg.connect(src.detune);vg.connect(src2.detune);vib.start();src.start();src2.start();N.push(src,src2,vib);voices.push({src,src2,v})}
  let ci=0;const change=()=>{const ch=chords[ci%chords.length],t=ctx.currentTime;ci++;voices.filter(x=>x.src).forEach(x=>{x.src.frequency.setTargetAtTime(ch[x.v],t,.8);x.src2.frequency.setTargetAtTime(ch[x.v],t,.8)});const vf=F[ci%3];voices.filter(x=>x.b).forEach(x=>x.b.frequency.setTargetAtTime(vf[x.k],t,1.5));T.push(setTimeout(change,6500))};change();return .35},
 '4'(G,N,T){const st=ctx.createGain();st.gain.value=0;const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;st.connect(lp);lp.connect(G);lp.connect(rev);
  [196,207.7,277.2,293.7].forEach((f,i)=>{for(let d of[-7,6]){const o=osc('sawtooth',f,.05,st,N);o.o.detune.value=d;const vb=ctx.createOscillator(),vg=ctx.createGain();vb.frequency.value=5+i*.3;vg.gain.value=6;vb.connect(vg);vg.connect(o.o.detune);vb.start();N.push(vb)}});
  osc('sawtooth',49,.18,lp,N);osc('sine',49,.5,G,N);
  const swell=()=>{const t=ctx.currentTime;st.gain.cancelScheduledValues(t);st.gain.setValueAtTime(st.gain.value,t);st.gain.linearRampToValueAtTime(.9,t+5);st.gain.linearRampToValueAtTime(.1,t+11);T.push(setTimeout(swell,12000+Math.random()*4000))};swell();return .3}
};
function play(id){init();if(ctx.state!=='running')ctx.resume();stop();const G=ctx.createGain();G.gain.value=0;G.connect(dry);const N=[],T=[];const lvl=ENG[id](G,N,T);G.gain.setTargetAtTime(lvl,ctx.currentTime,1.2);cur={g:G,nodes:N,tm:T};curId=id;render();document.getElementById('st').textContent='Gra: '+OPTS.find(o=>o[0]===id)[1]}
function render(){const L=document.getElementById('list');L.innerHTML='';OPTS.forEach(([id,name,desc])=>{const c=document.createElement('div');c.className='card'+(curId===id?' on':'');c.innerHTML='<b>'+(id==='0'?'':id+'. ')+name+'</b><p>'+desc+'</p>';const b=document.createElement('button');b.textContent=curId===id?'■ Zatrzymaj':'▶ Odtwórz';b.onclick=()=>{if(curId===id){stop();render();document.getElementById('st').textContent=''}else play(id)};c.appendChild(b);L.appendChild(c)})}
render();
</script>
</body>
</html>
